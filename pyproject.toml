[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pailang"
version = "1.0.0"
authors = [{ name = "Idontlikeurmom" }]
description = "A small, English-like programming language with AI model training built into the syntax."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["programming-language", "interpreter", "ai", "machine-learning", "education", "dsl", "llm"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Interpreters",
    "Intended Audience :: Education",
]

# The core language is pure standard library (no dependencies).
# Training (train/run/teach) needs PyTorch; the ai() builtin uses a local Ollama server.
[project.optional-dependencies]
ai = ["torch"]

[project.scripts]
pai = "cli:main"

[project.urls]
Homepage = "https://github.com/Idontlikeurmom/pai"
Repository = "https://github.com/Idontlikeurmom/pai"

[tool.setuptools]
py-modules = ["pai", "cli"]
